name: pre-commit
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Put nix devshell tools on PATH
        shell: bash
        run: nix develop -c printenv PATH >> "$GITHUB_PATH" # zizmor: ignore[github-env]
      - name: prek
        run: prek run --all-files --show-diff-on-failure
